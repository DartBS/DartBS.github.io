<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men Barada | Şahsy Kert</title>
    <style>
        /* Esasy sazlamalar we Font importy */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        /* Yşyk efektleri (Glow Effects) */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(-10px, -10px); }
            100% { transform: scale(1.2) translate(10px, 10px); }
        }

        /* Esasy Konteýner (Glassmorphism) */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* Profil suraty */
        .profile-img-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Söz we Başlyk Bölümleri */
        .title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Salgylar / Linkler Bölümi */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            text-decoration: none;
            color: #f8fafc;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .link-card:active {
            transform: translateY(-1px);
        }

        /* PNG İkonkalaryň Sazlamasy */
        .link-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            margin-right: 16px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .link-card:hover .link-icon {
            transform: scale(1.15);
        }

        .link-text {
            flex-grow: 1;
            text-align: left;
        }

        .arrow-icon {
            font-size: 18px;
            color: #64748b;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            color: #fff;
            transform: translateX(4px);
        }

        /* Aşaky Bölüm */
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #64748b;
        }

        /* Ýörite Akfent (Highlight) */
        .special-link {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .special-link:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(168, 85, 247, 0.35));
            border-color: rgba(168, 85, 247, 0.5);
        }
    </style>
</head>
<body>

    <!-- Arka fondaky yşyklar -->
    <div class="glow"></div>

    <!-- Esasy Kart -->
    <div class="card">
        
        <!-- Profil Suraty -->
        <div class="profile-img-box">
            <img src="profile.png" alt="Profil Suraty" class="profile-img" onerror="this.src='https://via.placeholder.com/110/3b82f6/ffffff?text=User'">
        </div>

        <!-- Şahsy Maglumatlar -->
        <h1 class="title">Hoş Geldiniz!</h1>
        <p class="subtitle">Meniň resmi sosial media we taslama baglanyşyklarym</p>

        <!-- Baglanyşyklar (Linkler) -->
        <div class="links-container">

            <!-- Link Platformasy -->
            <a href="https://linkm.me/users/rxhym" target="_blank" class="link-card">
                <img src="link.png" alt="Link" class="link-icon" onerror="this.src='https://via.placeholder.com/28/ffffff/000000?text=L'">
                <span class="link-text">Link Platformasy</span>
                <span class="arrow-icon">➔</span>
            </a>

            <!-- Telegram -->
            <a href="https://t.me/lenoxbest7" target="_blank" class="link-card">
                <img src="telegram.png" alt="Telegram" class="link-icon" onerror="this.src='https://via.placeholder.com/28/ffffff/000000?text=TG'">
                <span class="link-text">Telegram Profilim</span>
                <span class="arrow-icon">➔</span>
            </a>

            <!-- Sponsor Bot -->
            <a href="https://t.me/Vip_Vpns_Tkm_Bot" target="_blank" class="link-card special-link">
                <img src="sponsor.png" alt="Sponsor Bot" class="link-icon" onerror="this.src='https://via.placeholder.com/28/ffffff/000000?text=BOT'">
                <span class="link-text">Sponsor Bot</span>
                <span class="arrow-icon">➔</span>
            </a>

        </div>

        <!-- Futere degişli maglumat -->
        <div class="footer">
            © 2026 Ähli hukuklar goralan
        </div>

    </div>

</body>
</html>
